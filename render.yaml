services:
  - type: web
    name: wholesalemart
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: APP_PLATFORM_ADMIN_PHONE
        sync: false
      - key: APP_PLATFORM_ADMIN_PIN
        sync: false
      - key: APP_PLATFORM_ADMIN_NAME
        value: Platform Admin
      - key: APP_BOOTSTRAP_BUSINESS_NAME
        value: WholesaleMart Platform
      - key: APP_BOOTSTRAP_BUSINESS_SLUG
        value: platform
      - key: APP_BOOTSTRAP_PAYMENT_INSTRUCTIONS
        value: Manual payment. Upload transaction proof after approval.
      - key: APP_STORAGE_BACKEND
        value: database
      - key: APP_STORAGE_LIMIT_MB
        value: 8500
      - key: APP_UPLOADS_ENABLED
        value: true
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

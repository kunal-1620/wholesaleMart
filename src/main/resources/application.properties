spring.application.name=round1-b2b-commerce
server.port=${PORT:8080}
server.servlet.session.timeout=2h

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=true
spring.h2.console.enabled=false
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
app.bootstrap.business-name=${APP_BOOTSTRAP_BUSINESS_NAME:WholesaleMart Platform}
app.bootstrap.business-slug=${APP_BOOTSTRAP_BUSINESS_SLUG:platform}
app.bootstrap.contact-phone=${APP_BOOTSTRAP_CONTACT_PHONE:}
app.bootstrap.payment-instructions=${APP_BOOTSTRAP_PAYMENT_INSTRUCTIONS:Manual payment. Upload transaction proof after approval.}
app.bootstrap.platform-admin-name=${APP_PLATFORM_ADMIN_NAME:Platform Admin}
app.bootstrap.platform-admin-phone=${APP_PLATFORM_ADMIN_PHONE:}
app.bootstrap.platform-admin-pin=${APP_PLATFORM_ADMIN_PIN:}

app.storage.backend=${APP_STORAGE_BACKEND:database}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.region=${R2_REGION:auto}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.public-bucket=${R2_PUBLIC_BUCKET:}
app.storage.r2.private-bucket=${R2_PRIVATE_BUCKET:}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.storage.limit-mb=${APP_STORAGE_LIMIT_MB:8500}
app.uploads.enabled=${APP_UPLOADS_ENABLED:true}

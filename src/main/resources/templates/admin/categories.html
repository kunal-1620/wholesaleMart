<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
    <div class="brand"><img class="brand-logo" th:src="${business.logoPath ?: '/placeholder-logo.svg'}" alt=""><span th:text="${business.name}">Business</span></div>
    <nav class="nav"><a th:href="@{/b/{slug}/admin(slug=${business.slug})}">Dashboard</a><a th:href="@{/b/{slug}/admin/products(slug=${business.slug})}">Products</a><a th:href="@{/b/{slug}/admin/sizes(slug=${business.slug})}">Sizes</a><a th:href="@{/b/{slug}/admin/sets(slug=${business.slug})}">Sets</a><a th:href="@{/b/{slug}/admin/orders(slug=${business.slug})}">Orders</a><form class="inline-form" method="post" th:action="@{/b/{slug}/logout(slug=${business.slug})}"><button class="secondary">Logout</button></form></nav>
</header>
<main class="container">
    <div class="notice" th:if="${message}" th:text="${message}"></div>
    <div class="notice error" th:if="${error}" th:text="${error}"></div>
    <section class="card">
        <h1>Categories</h1>
        <p class="muted">Category names are unique per business and are selected while adding products.</p>
        <form method="post" th:action="@{/b/{slug}/admin/categories(slug=${business.slug})}">
            <div class="grid">
                <div><label>Category name</label><input name="name" required></div>
            </div>
            <div class="actions"><button>Add category</button></div>
        </form>
    </section>

    <div class="table-wrap" style="margin-top:18px">
        <table>
            <thead><tr><th>Name</th><th>Update</th></tr></thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.name}"></td>
                <td>
                    <form method="post" th:action="@{/b/{slug}/admin/categories(slug=${business.slug})}">
                        <input type="hidden" name="id" th:value="${category.id}">
                        <div class="grid">
                            <div><label>Name</label><input name="name" th:value="${category.name}" required></div>
                        </div>
                        <div class="actions"><button class="secondary">Save</button></div>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>

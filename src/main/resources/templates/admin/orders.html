<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
    <div class="brand"><img class="brand-logo" th:src="${business.logoPath ?: '/placeholder-logo.svg'}" alt=""><span th:text="${business.name}">Business</span></div>
    <nav class="nav"><a th:href="@{/b/{slug}/admin(slug=${business.slug})}">Dashboard</a><a th:href="@{/b/{slug}/admin/products(slug=${business.slug})}">Products</a><a th:href="@{/b/{slug}/admin/customers(slug=${business.slug})}">Customers</a><a th:href="@{/b/{slug}/admin/analytics(slug=${business.slug})}">Analytics</a><a th:if="${me.isPlatformAdmin()}" href="/platform">Platform</a><form class="inline-form" method="post" th:action="@{/b/{slug}/logout(slug=${business.slug})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="secondary">Logout</button></form></nav>
</header>
<main class="container">
    <div class="notice" th:if="${message}" th:text="${message}"></div>
    <div class="section-head">
        <div>
            <h1>Orders</h1>
            <p class="muted">Filter customer orders by customer, status, and created date.</p>
        </div>
    </div>
    <section class="card" style="margin-bottom:18px">
        <form class="filters order-filter" method="get" th:action="@{/b/{slug}/admin/orders(slug=${business.slug})}">
            <div>
                <label>Customer</label>
                <select name="customerId">
                    <option value="" th:selected="${selectedCustomerId == null}">All customers</option>
                    <option th:each="customer : ${customers}" th:value="${customer.id}" th:selected="${selectedCustomerId != null && selectedCustomerId == customer.id}" th:text="${customer.name + ' / ' + customer.phone}"></option>
                </select>
            </div>
            <div>
                <label>Status</label>
                <select name="status">
                    <option value="" th:selected="${selectedStatus == null}">All statuses</option>
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${selectedStatus == status}"></option>
                </select>
            </div>
            <div><label>Created from</label><input type="date" name="createdFrom" th:value="${createdFrom}"></div>
            <div><label>Created to</label><input type="date" name="createdTo" th:value="${createdTo}"></div>
            <div class="filter-actions">
                <button>Apply filters</button>
                <a class="button secondary" th:href="@{/b/{slug}/admin/orders(slug=${business.slug})}">Reset</a>
            </div>
        </form>
    </section>
    <div class="table-wrap">
        <table>
            <thead><tr><th>ID</th><th>Customer</th><th>Status</th><th>Total</th><th>Created</th><th></th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="6" class="empty-state">No orders found for this filter.</td>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.customer.name}"></td>
                <td><span class="badge status-badge" th:classappend="${'status-' + order.status.name()}" th:text="${order.status}"></span></td>
                <td th:text="${order.totalAmount}"></td>
                <td th:text="${order.createdAt != null ? order.createdAt.toLocalDate().toString() : '-'}"></td>
                <td><a th:href="@{/b/{slug}/admin/orders/{id}(slug=${business.slug},id=${order.id})}">Review</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
